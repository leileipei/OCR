name: build-offline-package

on:
  workflow_dispatch:
  push:
    tags:
      - 'offline-v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run the complete test suite before building
        run: python -m pytest -q
      - name: Build the complete offline package
        shell: powershell
        run: >-
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File scripts/build-offline-package.ps1
      - name: Verify the built archive with zero skipped product tests
        shell: powershell
        run: |
          $archive = Resolve-Path 'dist/umi-ocr-phase0-offline-rapid-v2.1.5-tool-v0.2.0.zip'
          $env:BUILT_OFFLINE_PACKAGE = $archive.Path
          $pytestOutput = @(
            python -m pytest tests/test_offline_package.py -q -rs 2>&1
          )
          $pytestExitCode = $LASTEXITCODE
          $pytestOutput | ForEach-Object { Write-Host $_ }
          if ($pytestExitCode -ne 0) {
            throw "Built archive tests failed with exit code $pytestExitCode"
          }
          $pytestSummary = $pytestOutput -join [Environment]::NewLine
          if ($pytestSummary -match '(?m)(^|\s)[1-9][0-9]* skipped\b') {
            throw 'Built archive tests must complete with 0 skipped'
          }
      - name: Upload the exact offline publication set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: umi-ocr-phase0-offline-rapid-v2.1.5-tool-v0.2.0
          path: |
            dist/umi-ocr-phase0-offline-rapid-v2.1.5-tool-v0.2.0.zip
            dist/umi-ocr-phase0-offline-rapid-v2.1.5-tool-v0.2.0.zip.sha256
            dist/sbom.json
            dist/THIRD_PARTY_NOTICES.txt
            docs/validation/README-release.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
