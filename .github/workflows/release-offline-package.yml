name: release-offline-package

on:
  push:
    tags:
      - 'offline-v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Reject tags that do not exactly match this package version
        shell: powershell
        run: |
          if ($env:GITHUB_REF_NAME -cne 'offline-v0.2.0') {
            throw "Refusing to build or publish an unexpected offline tag: $env:GITHUB_REF_NAME"
          }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run the complete test suite before building
        run: python -m pytest -q
      - name: Build the complete offline package
        shell: powershell
        run: >-
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File scripts/build-offline-package.ps1
      - name: Verify the built archive with zero skipped product tests
        shell: powershell
        run: |
          $archive = Resolve-Path 'dist/umi-ocr-phase0-offline-rapid-v2.1.5-tool-v0.2.0.zip'
          $env:BUILT_OFFLINE_PACKAGE = $archive.Path
          $pytestOutput = @(
            python -m pytest tests/test_offline_package.py -q -rs 2>&1
          )
          $pytestExitCode = $LASTEXITCODE
          $pytestOutput | ForEach-Object { Write-Host $_ }
          if ($pytestExitCode -ne 0) {
            throw "Built archive tests failed with exit code $pytestExitCode"
          }
          $pytestSummary = $pytestOutput -join [Environment]::NewLine
          if ($pytestSummary -match '(?m)(^|\s)[1-9][0-9]* skipped\b') {
            throw 'Built archive tests must complete with 0 skipped'
          }
      - name: Verify archive hash, SBOM, and third-party licenses
        shell: powershell
        run: |
          $archiveName = 'umi-ocr-phase0-offline-rapid-v2.1.5-tool-v0.2.0.zip'
          $archive = Resolve-Path (Join-Path 'dist' $archiveName)
          $hashFile = Resolve-Path (Join-Path 'dist' ($archiveName + '.sha256'))
          $hashLine = (Get-Content -LiteralPath $hashFile.Path -Raw).Trim()
          $hashPattern = '^([0-9a-f]{64})  ' + [regex]::Escape($archiveName) + '$'
          $hashMatch = [regex]::Match($hashLine, $hashPattern)
          if (-not $hashMatch.Success) {
            throw 'ZIP SHA-256 sidecar has an invalid format or filename'
          }
          $expectedHash = $hashMatch.Groups[1].Value
          $actualHash = (Get-FileHash -LiteralPath $archive.Path -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -cne $expectedHash) {
            throw 'ZIP SHA-256 does not match its sidecar'
          }

          $sbomPath = Resolve-Path 'dist/sbom.json'
          $sbom = Get-Content -LiteralPath $sbomPath.Path -Raw | ConvertFrom-Json
          if ($sbom.schema_version -cne '1.0' -or $sbom.tool_version -cne '0.2.0') {
            throw 'SBOM schema or tool version is invalid'
          }
          if (@($sbom.components).Count -ne 11) {
            throw 'SBOM must contain exactly 11 components'
          }
          foreach ($component in @($sbom.components)) {
            $missingName = [string]::IsNullOrWhiteSpace([string]$component.name)
            $missingVersion = [string]::IsNullOrWhiteSpace([string]$component.version)
            $missingSource = [string]::IsNullOrWhiteSpace([string]$component.source_url)
            $invalidDigest = [string]$component.sha256 -cnotmatch '^[0-9a-f]{64}$'
            $missingLicenses = @($component.license_files).Count -eq 0
            if ($missingName -or $missingVersion -or $missingSource -or $invalidDigest -or $missingLicenses) {
              throw "SBOM component metadata is incomplete: $($component.name)"
            }
          }

          $noticesPath = Resolve-Path 'dist/THIRD_PARTY_NOTICES.txt'
          $notices = Get-Content -LiteralPath $noticesPath.Path -Raw
          if ([string]::IsNullOrWhiteSpace($notices)) {
            throw 'Third-party notices must not be empty'
          }
          foreach ($component in @($sbom.components)) {
            if ($notices -notmatch [regex]::Escape([string]$component.name)) {
              throw "Third-party notices omit component: $($component.name)"
            }
          }
      - name: Create the draft release with the exact publication set
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            dist/umi-ocr-phase0-offline-rapid-v2.1.5-tool-v0.2.0.zip `
            dist/umi-ocr-phase0-offline-rapid-v2.1.5-tool-v0.2.0.zip.sha256 `
            dist/sbom.json `
            dist/THIRD_PARTY_NOTICES.txt `
            docs/validation/README-release.md `
            --repo $env:GITHUB_REPOSITORY `
            --title "Umi-OCR Phase 0 Offline Validation Package v0.2.0" `
            --notes-file docs/validation/README-release.md `
            --verify-tag `
            --draft
