name: test

on:
  pull_request:
  push:
    branches: [main, codex/umi-ocr-web-phase0]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run Python contract tests
        run: python -m pytest -q
      - name: Check Python 3.8 grammar
        run: >-
          python -c "import ast,pathlib; files=list(pathlib.Path('src').rglob('*.py'))+list(pathlib.Path('tests').rglob('*.py')); [ast.parse(p.read_text(encoding='utf-8'), filename=str(p), feature_version=(3,8)) for p in files]"
      - name: Parse PowerShell sources with the Windows parser
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $parseFailures = @()
          Get-ChildItem -LiteralPath scripts -Recurse -File |
            Where-Object { $_.Extension -in @('.ps1', '.psm1') } |
            ForEach-Object {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName,
                [ref]$tokens,
                [ref]$parseErrors
              ) | Out-Null
              foreach ($parseError in @($parseErrors)) {
                $parseFailures += "$($_.FullName): $($parseError.Message)"
              }
            }
          if ($parseFailures.Count -ne 0) {
            throw ($parseFailures -join [Environment]::NewLine)
          }
      - name: Exercise scheduled-task fixture DryRun without registration
        if: runner.os == 'Windows'
        run: >-
          python -m pytest
          tests/test_powershell_contract.py::test_task_definition_dry_run_on_windows_without_registration
          -q
